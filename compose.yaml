services:
  postgres:
    image: postgres:18
    container_name: reviewly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: reviewly
      POSTGRES_PASSWORD: reviewly
      POSTGRES_DB: reviewly
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reviewly -d reviewly"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
